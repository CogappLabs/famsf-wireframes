              - paragraph [ref=e81]: About this work
              - generic [ref=e82]: "Source: Current gallery label"
            - paragraph [ref=e83]: For many familiar with Richard Diebenkorn’s work, his intense focus on clubs and spades was a surprising departure from his hugely popular Ocean Park series. The motifs’ bulbous, curvilinear forms starkly contrast with the dramatic rectilinear compositions characterizing Ocean Park and many of his other works on paper. While the views of Ocean Park are distant and geometric, Diebenkorn’s exploration of clubs and spades enfolds the viewer in a close examination of an intimate theme, enlarging forms typically experienced in miniature so that they fill most of the printing plate.
